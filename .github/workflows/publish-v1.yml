name: Publish checked v1.0.0 archive
on:
  push:
    tags: ['v1.0.0']
permissions:
  contents: write
concurrency:
  group: dm-paper-v1.0.0-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'Atalebe/dm_mass_loss_accretion_history'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Fetch exact public tagged source
        env:
          EXPECTED_REPOSITORY: Atalebe/dm_mass_loss_accretion_history
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$GITHUB_REF" = refs/tags/v1.0.0
          git init source
          git -C source remote add origin "https://github.com/$EXPECTED_REPOSITORY.git"
          git -C source fetch --no-tags --depth=1 origin "$GITHUB_REF"
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Verify and publish the authorized release
        working-directory: source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
        run: python3 -B tools/publish_archival_release.py --publish
